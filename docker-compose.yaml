services:
  api:
    build:
      context: ./api
    restart: always
    environment:
      - PORT=9000
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-aws}
      - SITE_DOMAIN=${SITE_DOMAIN:-yok.ninja}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - KAFKA_BROKER=${KAFKA_BROKER}
      - KAFKA_USERNAME=${KAFKA_USERNAME}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_TOPIC=${KAFKA_TOPIC}
      - KAFKA_CA_PATH=/app/ca.pem
      - CLICKHOUSE_URL=${CLICKHOUSE_URL}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE}
      - PROXY_SERVICE_TOKEN=${PROXY_SERVICE_TOKEN}
      - BOOTSTRAP_SECRET=${BOOTSTRAP_SECRET}
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ECS_CLUSTER=${AWS_ECS_CLUSTER}
      - AWS_ECS_TASK_DEFINITION=${AWS_ECS_TASK_DEFINITION}
      - AWS_ECS_CONTAINER_NAME=${AWS_ECS_CONTAINER_NAME}
      - AWS_ECS_SUBNETS=${AWS_ECS_SUBNETS}
      - AWS_ECS_SECURITY_GROUPS=${AWS_ECS_SECURITY_GROUPS}
    ports:
      - "9000:9000"
    volumes:
      - ./api/prisma:/app/prisma:ro
      - ./api/ca.pem:/app/ca.pem:ro
    networks:
      - yok-network

  reverse-proxy:
    build:
      context: ./reverse-proxy
    restart: always
    environment:
      - PORT=8000
      - API_SERVER_URL=http://api:9000
      - ARTIFACT_BASE_URL=${ARTIFACT_BASE_URL}
      - PROXY_SERVICE_TOKEN=${PROXY_SERVICE_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      - api
    networks:
      - yok-network

networks:
  yok-network:
    driver: bridge
    name: yok-network